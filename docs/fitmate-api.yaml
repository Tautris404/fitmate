        with a reverse patinka sets match=true and creates/reuses a match chat in the same transaction. Skip/one-sided
        like returns match=false. A pair choice cannot be repeated/overwritten. Swiped athletes disappear from the
        caller''s feed. No swipe ID is returned. A deleted/missing swiper record currently maps to 500. Allowed
        roles: athlete.'
