      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                image not found
    ReviewNotFound:
      description: Review not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                review not found
    TrainerNotFound:
      description: Trainer not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                trainer not found
    SwipeTargetNotFound:
      description: Athlete not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                athlete not found
  schemas:
    TextError:
      type: string
      description: Plain-text message with a trailing newline, not a JSON error object.
      example: |
        invalid swipe target id
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    IDMessageResponse:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Affected user, image, gym or review ID, according to the operation.
          maximum: 2147483647
        message:
          type: string
      required:
        - id
        - message
    Gender:
      type: string
      enum:
        - vyras
        - moteris
        - kita
    PreferredGender:
      type: string
      enum:
        - visi
        - vyras
        - moteris
        - kita
      description: visi accepts all genders; empty is invalid.
    RoleName:
      type: string
      enum:
        - atletas
        - treneris
        - administratorius
    UserImage:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        image_url:
          type: string
          example: /uploads/images/0123456789abcdef0123456789abcdef.jpg
          description: Public relative URL, resolved against the API server.
      required:
        - id
        - image_url
    GymRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: FitMate Vilnius
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: Sporto g. 1
        city:
          type: string
          minLength: 1
          maxLength: 100
          example: Vilnius
      description: Fields are trimmed and must remain nonempty; name/address/city together must be unique.
      required:
        - name
        - address
        - city
    Gym:
      allOf:
        - $ref: '#/components/schemas/GymRequest'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              maximum: 2147483647
          required:
            - id
    Specialization:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        name:
          type: string
          example: Jegos treniruotes
      required:
        - id
        - name
    PreferredWorkoutTime:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 1
          example: 1
          description: 1 = Monday, 7 = Sunday.
          maximum: 7
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '18:00'
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '19:30'
      description: Same-day HH:MM times. End must be strictly after start. Ranges for the same weekday cannot overlap;
        touching boundaries are allowed.
      required:
        - day_of_week
        - start_time
        - end_time
    AthleteProfile:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
          example: '1998-03-12'
          description: YYYY-MM-DD, not in the future. No minimum age is enforced.
        height:
          type: number
          format: double
          minimum: 0.01
          maximum: 999.99
          example: 182
          description: Centimetres.
        weight:
          type: number
          format: double
          minimum: 0.01
          maximum: 999.99
          example: 82.5
          description: Kilograms.
        experience_years:
          type: integer
          minimum: 0
          default: 0
          example: 3
          maximum: 2147483647
        min_age:
          type: integer
          minimum: 0
          default: 0
          example: 0
          maximum: 100
        max_age:
          type: integer
          minimum: 0
          default: 0
          example: 100
          maximum: 100
        preferred_gender:
          $ref: '#/components/schemas/PreferredGender'
        min_experience:
          type: integer
          minimum: 0
          default: 0
          example: 0
          maximum: 100
        max_experience:
          type: integer
          minimum: 0
          default: 0
          example: 100
          maximum: 100
      description: Profile and saved feed filters. min_age <= max_age; min_experience <= max_experience. All fields
        appear in GET responses. Omitted numeric inputs become 0, including the maximum filter values.
      required:
        - date_of_birth
        - height
        - weight
        - preferred_gender
    TrainerProfileInput:
      type: object
      properties:
        work_experience_years:
          type: integer
          minimum: 0
          default: 0
          example: 7
          maximum: 2147483647
        education:
          type: string
          minLength: 1
          maxLength: 255
          example: Sporto bakalauro studijos.
          description: Trimmed and nonempty.
        specialization_ids:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          uniqueItems: true
          nullable: true
          description: Existing IDs. Empty/null/omitted means no specializations.
      required:
        - education
    TrainerProfileDetailed:
      type: object
      properties:
        work_experience_years:
          type: integer
          minimum: 0
          maximum: 2147483647
        education:
          type: string
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/Specialization'
      required:
        - work_experience_years
        - education
        - specializations
    ProfileUpdateFields:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Jonas
          description: Trimmed and nonempty.
        gender:
          $ref: '#/components/schemas/Gender'
        bio:
          type: string
          maxLength: 1000
          default: ''
          example: Ieskau sporto partnerio.
        gym_ids:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          uniqueItems: true
          nullable: true
          description: Existing gym IDs. Empty/null/omitted replaces associations with an empty set.
        preferred_workout_times:
          type: array
          items:
            $ref: '#/components/schemas/PreferredWorkoutTime'
          nullable: true
          description: Empty/null/omitted replaces associations with an empty set.
      description: 'Full replacement, not PATCH: omitted bio becomes empty, omitted association arrays clear gyms/times/specializations.
        Use the profile matching the existing role. Email, role and images are not editable here.'
      required:
        - first_name
        - gender
    ProfileUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProfileUpdateFields'
        - oneOf:
            - type: object
              properties:
                athlete_profile:
                  $ref: '#/components/schemas/AthleteProfile'
                trainer_profile:
                  type: object
                  nullable: true
                  enum:
                    - null
                  description: Other role profile must be omitted or null.
              required:
                - athlete_profile
            - type: object
              properties:
                trainer_profile:
                  $ref: '#/components/schemas/TrainerProfileInput'
                athlete_profile:
                  type: object
                  nullable: true
                  enum:
                    - null
                  description: Other role profile must be omitted or null.
              required:
                - trainer_profile
    AdminProfileUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProfileUpdateRequest'
        - type: object
          properties:
            password:
              type: string
              format: password
              nullable: true
              description: Omitted/null/empty preserves password. Nonempty requires at least 8 Unicode characters
                and at most 72 UTF-8 bytes; otherwise 400.
              example: NewTestas123!
    RegistrationFields:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 100
          example: athlete.new@example.com
          description: Trimmed, valid bare address, unique, case is not normalized.
        password:
          type: string
          format: password
          minLength: 8
          example: Testas123!
          description: At least 8 Unicode characters. bcrypt supports at most 72 UTF-8 bytes; registration currently
            returns 500 for a longer password.
        role:
          type: integer
          minimum: 1
          enum:
            - 1
            - 2
          description: 1 = athlete; 2 = trainer. Administrator registration is rejected.
          maximum: 2
        first_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Jonas
          description: Trimmed and nonempty.
        gender:
          $ref: '#/components/schemas/Gender'
        bio:
          type: string
          maxLength: 1000
          default: ''
          example: Ieskau sporto partnerio.
        gym_ids:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
          uniqueItems: true
          nullable: true
          description: Existing gym IDs. Empty/null/omitted replaces associations with an empty set.
        preferred_workout_times:
          type: array
          items:
            $ref: '#/components/schemas/PreferredWorkoutTime'
          nullable: true
          description: Empty/null/omitted replaces associations with an empty set.
      required:
        - email
        - password
        - role
        - first_name
        - gender
    RegistrationData:
      description: JSON serialized into the multipart data TEXT field. The matching role profile is required; the
        other must be absent/null.
      allOf:
        - $ref: '#/components/schemas/RegistrationFields'
        - oneOf:
            - type: object
              properties:
                athlete_profile:
                  $ref: '#/components/schemas/AthleteProfile'
                trainer_profile:
                  type: object
                  nullable: true
                  enum:
                    - null
                  description: Other role profile must be omitted or null.
                role:
                  type: integer
                  enum:
                    - 1
              required:
                - athlete_profile
            - type: object
              properties:
                trainer_profile:
                  $ref: '#/components/schemas/TrainerProfileInput'
                athlete_profile:
                  type: object
                  nullable: true
                  enum:
                    - null
                  description: Other role profile must be omitted or null.
                role:
                  type: integer
                  enum:
                    - 2
              required:
                - trainer_profile
      example:
        email: athlete.new@example.com
        password: Testas123!
        role: 1
        first_name: Jonas
        gender: vyras
        bio: Ieskau sporto partnerio.
        gym_ids:
          - 1
        preferred_workout_times:
          - day_of_week: 1
            start_time: '18:00'
            end_time: '19:30'
        athlete_profile:
          date_of_birth: '1998-03-12'
          height: 182
          weight: 82.5
          experience_years: 3
          min_age: 0
          max_age: 100
          preferred_gender: visi
          min_experience: 0
          max_experience: 100
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 100
          example: athlete.new@example.com
          description: Trimmed, valid bare address, unique, case is not normalized.
        password:
          type: string
          format: password
          minLength: 8
          example: Testas123!
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: HS256 access JWT.
        refresh_token:
          type: string
          description: Opaque token. No refresh endpoint is currently registered.
        access_expires_at:
          type: string
          format: date-time
          description: Access expiry from server TTL configuration.
        refresh_expires_at:
          type: string
          format: date-time
          description: Refresh expiry from server TTL configuration.
      required:
        - access_token
        - refresh_token
        - access_expires_at
        - refresh_expires_at
    UserProfile:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        bio:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/UserImage'
        athlete_profile:
          $ref: '#/components/schemas/AthleteProfile'
        trainer_profile:
          $ref: '#/components/schemas/TrainerProfileDetailed'
        gyms:
          type: array
          items:
            $ref: '#/components/schemas/Gym'
        preferred_workout_times:
          type: array
          items:
            $ref: '#/components/schemas/PreferredWorkoutTime'
      description: Flattened fields with no wrapper. Role-specific profile is omitted when irrelevant. Arrays are
        [] when empty. No user ID or role fields.
      required:
        - email
        - first_name
        - gender
        - bio
        - images
        - gyms
        - preferred_workout_times
    UserDetails:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              maximum: 2147483647
            role_name:
              $ref: '#/components/schemas/RoleName'
          required:
            - id
            - role_name
      description: 'Admin view: flattened profile plus id/role_name. Administrator accounts have neither role-specific
        profile.'
    UserListItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        email:
          type: string
          format: email
        first_name:
          type: string
        role_name:
          $ref: '#/components/schemas/RoleName'
      required:
        - id
        - email
        - first_name
        - role_name
    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
        - users
        - page
        - limit
        - total
        - total_pages
    AthleteListItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        first_name:
          type: string
        bio:
          type: string
        age:
          type: integer
          minimum: 0
          description: Completed years at database current date.
        height:
          type: number
          format: double
          description: Centimetres.
        weight:
          type: number
          format: double
          description: Kilograms.
        experience_years:
          type: integer
          minimum: 0
          maximum: 2147483647
        images:
          type: array
          items:
            $ref: '#/components/schemas/UserImage'
        gyms:
          type: array
          items:
            $ref: '#/components/schemas/Gym'
        preferred_workout_times:
          type: array
          items:
            $ref: '#/components/schemas/PreferredWorkoutTime'
      description: 'Public swipe profile: no gender, email, date of birth, role or saved filter preferences.'
      required:
        - id
        - first_name
        - bio
        - age
        - height
        - weight
        - experience_years
        - images
        - gyms
        - preferred_workout_times
    AthleteListResponse:
      type: object
      properties:
        athletes:
          type: array
          items:
            $ref: '#/components/schemas/AthleteListItem'
          maxItems: 20
        seed:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Generated/normalized lowercase seed; reuse for continuation.
        next_after_id:
          type: integer
          minimum: 0
          description: Last returned ID when has_more=true, otherwise 0. Stop at has_more=false.
          maximum: 2147483647
        has_more:
          type: boolean
      required:
        - athletes
        - seed
        - next_after_id
        - has_more
    TrainerListItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        first_name:
          type: string
        bio:
          type: string
        work_experience_years:
          type: integer
          minimum: 0
          maximum: 2147483647
        education:
          type: string
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/Specialization'
        images:
          type: array
          items:
            $ref: '#/components/schemas/UserImage'
        gyms:
          type: array
          items:
            $ref: '#/components/schemas/Gym'
        preferred_workout_times:
          type: array
          items:
            $ref: '#/components/schemas/PreferredWorkoutTime'
        average_rating:
          type: number
          minimum: 0
          maximum: 5
          description: Average rounded to 2 decimals, or 0 if no reviews.
        review_count:
          type: integer
          minimum: 0
      description: 'Public trainer profile: no gender/email/role. gyms includes all memberships, not only the selected
        gym. Reviews are retrieved separately.'
      required:
        - id
        - first_name
        - bio
        - work_experience_years
        - education
        - specializations
        - images
        - gyms
        - preferred_workout_times
        - average_rating
        - review_count
    TrainerListResponse:
      type: object
      properties:
        trainers:
          type: array
          items:
            $ref: '#/components/schemas/TrainerListItem'
          maxItems: 20
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          enum:
            - 20
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
        - trainers
        - page
        - limit
        - total
        - total_pages
    Review:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        author_name:
          type: string
          example: Jonas
        comment:
          type: string
          example: Puikus treneris.
        rating:
          type: integer
          minimum: 1
          example: 5
          maximum: 5
      required:
        - id
        - author_name
        - comment
        - rating
    ReviewPostRequest:
      type: object
      properties:
        trainer_user_id:
          type: integer
          minimum: 1
          example: 7
          maximum: 2147483647
        comment:
          type: string
          default: ''
          description: Optional; trimmed. Only the whole-body size limit applies.
        rating:
          type: integer
          minimum: 1
          example: 5
          maximum: 5
      required:
        - trainer_user_id
        - rating
    ReviewUpdateRequest:
      type: object
      properties:
        comment:
          type: string
          default: ''
          description: Trimmed; omission clears comment.
        rating:
          type: integer
          minimum: 1
          example: 4
          maximum: 5
      required:
        - rating
    SwipePostRequest:
      type: object
      properties:
        target_user_id:
          type: integer
          minimum: 1
          example: 11
          description: Another athlete user ID.
          maximum: 2147483647
        action:
          type: string
          enum:
            - patinka
            - nepatinka
          example: patinka
      required:
        - target_user_id
        - action
    SwipeResponse:
      type: object
      properties:
        message:
          type: string
          example: swipe created successfully
        match:
          type: boolean
          description: True only for mutual patinka; the pair chat exists after successful commit. False for a skip
            or one-sided like.
      required:
        - message
        - match
    RegistrationMultipart:
      type: object
      properties:
        data:
          type: string
          description: JSON serialized as a required form TEXT field, not a file. x-json-schema points to its object
            contract.
          example: '{"email":"athlete.new@example.com","password":"Testas123!","role":1,"first_name":"Jonas","gender":"vyras","bio":"Ieskau
            sporto partnerio.","gym_ids":[1],"preferred_workout_times":[{"day_of_week":1,"start_time":"18:00","end_time":"19:30"}],"athlete_profile":{"date_of_birth":"1998-03-12","height":182,"weight":82.5,"experience_years":3,"min_age":0,"max_age":100,"preferred_gender":"visi","min_experience":0,"max_experience":100}}'
          x-json-schema:
            $ref: '#/components/schemas/RegistrationData'
        images:
          type: array
          items:
            type: string
            format: binary
          minItems: 1
          maxItems: 10
          description: Repeat images for 1-10 files. JPEG, PNG or WebP content (JFIF containing JPEG also works).
            Format is checked by content, not extension. Each file is at most 10 MiB (10485760 bytes) and 60000000
            pixels, with positive dimensions. Saved as JPEG, resized within 1600x1600 preserving aspect ratio, compressed
            to at most 1 MiB.
      required:
        - data
        - images
    SingleImageMultipart:
      type: object
      properties:
        images:
          type: string
          format: binary
          description: Exactly one file under the plural field name images. JPEG, PNG or WebP content (JFIF containing
            JPEG also works). Format is checked by content, not extension. Each file is at most 10 MiB (10485760
            bytes) and 60000000 pixels, with positive dimensions. Saved as JPEG, resized within 1600x1600 preserving
            aspect ratio, compressed to at most 1 MiB.
      required:
        - images
