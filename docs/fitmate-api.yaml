  /uploads/images/{fileName}:
    get:
      tags:
        - Uploads
      summary: Download an uploaded image
      description: Public access via Go http.FileServer. Use image_url from a profile. Standard conditional and
        byte-range behavior applies. The wider /uploads/ subtree can also expose directory listings.
      operationId: getUploadedImage
      security: []
      parameters:
        - name: fileName
          in: path
          required: true
          description: Stored image file name from image_url. New uploads have 32 lowercase hexadecimal characters
            followed by .jpg.
          schema:
            type: string
            example: 0123456789abcdef0123456789abcdef.jpg
        - name: If-Modified-Since
          in: header
          schema:
            type: string
          description: HTTP-date for conditional retrieval.
        - name: Range
          in: header
          schema:
            type: string
            example: bytes=0-99
          description: Standard HTTP byte range.
      responses:
        '200':
          description: Stored JPEG image.
          headers:
            Last-Modified:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range (HEAD returns headers only).
          headers:
            Last-Modified:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Content-Range:
              schema:
                type: string
                example: bytes 0-99/1024
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified; no body.
        '403':
          description: File-system access denied.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    403 Forbidden
        '404':
          description: Image file does not exist.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    404 page not found
        '416':
          description: Invalid or unsatisfiable byte range.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
    head:
      tags:
        - Uploads
      summary: Get uploaded image headers
      description: Public access via Go http.FileServer. Use image_url from a profile. Standard conditional and
        byte-range behavior applies. The wider /uploads/ subtree can also expose directory listings.
      operationId: headUploadedImage
      security: []
      parameters:
        - name: fileName
          in: path
          required: true
          description: Stored image file name from image_url. New uploads have 32 lowercase hexadecimal characters
            followed by .jpg.
          schema:
            type: string
            example: 0123456789abcdef0123456789abcdef.jpg
        - name: If-Modified-Since
          in: header
          schema:
            type: string
          description: HTTP-date for conditional retrieval.
        - name: Range
          in: header
          schema:
            type: string
            example: bytes=0-99
          description: Standard HTTP byte range.
      responses:
        '200':
          description: Image headers only; empty response body.
          headers:
            Last-Modified:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
        '206':
          description: Requested byte range (HEAD returns headers only).
          headers:
            Last-Modified:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Content-Range:
              schema:
                type: string
                example: bytes 0-99/1024
        '304':
          description: Not modified; no body.
        '403':
          description: File-system access denied.
        '404':
          description: Image file does not exist.
        '416':
          description: Invalid or unsatisfiable byte range.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use access_token returned by POST /auth/login. The refresh token is not a Bearer access token.
  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: User ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    GymID:
      name: id
      in: path
      required: true
      description: Gym ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ReviewID:
      name: id
      in: path
      required: true
      description: Review ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    TrainerID:
      name: trainerId
      in: path
      required: true
      description: Trainer user ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    ImageID:
      name: imageId
      in: path
      required: true
      description: Image ID scoped to the selected user or token owner.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    Page:
      name: page
      in: query
      required: false
      description: Starts at 1; offset overflow is rejected. Pages past the end return empty arrays.
      schema:
        type: integer
        minimum: 1
        default: 1
    UserLimit:
      name: limit
      in: query
      required: false
      description: Users per page.
      schema:
        type: integer
        minimum: 1
        default: 10
        maximum: 100
    AthleteSeed:
      name: seed
      in: query
      required: false
      description: 32 hexadecimal characters, case-insensitive. Empty/omitted generates a seed only if after_id=0.
        Nonzero after_id requires the same nonempty seed used previously. Restart without seed/after_id after changing
        preferences. This is a public ordering seed, not an access token.
      schema:
        type: string
        pattern: ^([0-9a-fA-F]{32})?$
        example: 0123456789abcdef0123456789abcdef
    AthleteAfterID:
      name: after_id
      in: query
      required: false
      description: Use next_after_id from the previous page with the same seed. Zero starts from the beginning.
        Stop at has_more=false.
      schema:
        type: integer
        minimum: 0
        default: 0
        maximum: 2147483647
  requestBodies:
    Registration:
      required: true
      description: 'multipart/form-data: data is a JSON TEXT field; images contains 1-10 repeated file parts. Whole
        request maximum: 50 MiB (52428800 bytes). Do not send the JSON as the entire request body.'
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/RegistrationMultipart'
          encoding:
            data:
              contentType: text/plain
            images:
              contentType: image/jpeg, image/png, image/webp
    SingleImage:
      required: true
      description: 'Exactly one image file named images. Whole request limit: 11 MiB (11534336 bytes). Individual
        file limit: 10 MiB. At most 10 images per profile. Invalid/oversized individual images or the profile count
        limit return 400; whole request overflow returns 413.'
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/SingleImageMultipart'
          encoding:
            images:
              contentType: image/jpeg, image/png, image/webp
    LoginRequest:
      required: true
      description: JSON body; maximum 1 MiB (1048576 bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    ProfileUpdateRequest:
      required: true
      description: JSON body; maximum 1 MiB (1048576 bytes).
      content:
        application/json:
