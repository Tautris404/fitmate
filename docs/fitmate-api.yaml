          schema:
            $ref: '#/components/schemas/SwipePostRequest'
  responses:
    Unauthorized:
      description: Missing, expired or invalid Bearer access token.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum:
              - Bearer
    Forbidden:
      description: The authenticated role is not allowed.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
                forbidden
    InternalServerError:
      description: Unexpected database, storage or server failure.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/TextError'
          examples:
            error1:
              value: |
