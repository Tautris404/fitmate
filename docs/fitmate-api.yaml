openapi: 3.0.3
info:
  title: FitMate API
  version: 1.0.0
  description: |-
    Contract for the currently implemented Go backend: all 28 registered API operations, plus public image GET/HEAD operations.

    JWT role_id values: 1 = athlete (atletas), 2 = trainer (treneris), 3 = administrator (administratorius). Protected operations use Authorization: Bearer <access_token>. Role restrictions are stated per operation and in x-roles. Middleware validates the HS256 signature and expiry, but does not check database sessions or account existence.

    Successful API responses use application/json. Handler/middleware errors use text/plain; charset=utf-8 with a trailing newline. JSON handlers ignore unknown fields and do not enforce the Content-Type header. Multipart requests need a multipart/form-data boundary.

    Normal JSON bodies have a 1 MiB limit; multipart limits differ per operation. PUT profile methods replace editable fields and association arrays. Omitted numeric fields become zero; the API does not default max_age or max_experience to 100.

    Only implemented methods are included. Refresh, logout, standalone athlete/trainer profile GET and chat/message API methods are not registered. Login nevertheless returns a refresh token.

    Go http.FileServer publicly serves the /uploads/ subtree, including standard HEAD, conditional and range behavior and possible directory listings. Image operations below document the concrete URLs generated by storage. Unknown routes and unsupported methods may also return standard router 404/405 responses.
servers:
  - url: http://localhost:8080
    description: Local backend; adjust to the configured API_PORT.
tags:
  - name: Authentication
  - name: Users
  - name: User images
  - name: Athletes
  - name: Gyms
  - name: Trainers
  - name: Reviews
  - name: Swipes
  - name: Uploads
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register an athlete or trainer
      description: Create an account, the matching profile, associations and 1-10 images. Returns message only;
        does not log in the new user.
      operationId: register
      x-roles: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: user registered successfully
        '400':
          description: Invalid multipart/data, role/profile/associations or images.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid multipart form
                error2:
                  value: |
                    data is required
                error3:
                  value: |
                    invalid registration data
                error4:
                  value: |
                    invalid preferred gender
        '409':
          description: Email already registered.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    email already exists
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Registration'
      x-max-request-bytes: 52428800
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticate any role and create a database session with access and refresh tokens. Expiries
        use server configuration. No refresh/logout operation is currently registered.
      operationId: login
      x-roles: []
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Malformed JSON or invalid email/password input.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid login data
        '401':
          description: Incorrect credentials. The login handler does not set WWW-Authenticate.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid email or password
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      requestBody:
        $ref: '#/components/requestBodies/LoginRequest'
      x-max-request-bytes: 1048576
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: 'All roles, including administrators, ordered by ID ascending. Empty pages are valid. Allowed
        roles: administrator.'
      operationId: listUsers
      x-roles:
        - administrator
      responses:
        '200':
          description: User page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Invalid page/limit or offset overflow.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid page
                error2:
                  value: |
                    limit must be between 1 and 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/UserLimit'
    post:
      tags:
        - Users
      summary: Create an athlete or trainer
      description: 'Same multipart contract as registration, with administrator authorization. Cannot create role
        3. Allowed roles: administrator.'
      operationId: createUser
      x-roles:
        - administrator
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 82
                message: user created successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid multipart/data, role/profile/associations or images.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already registered.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    email already exists
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/Registration'
      x-max-request-bytes: 52428800
  /users/me:
    get:
      tags:
        - Users
      summary: Get my full profile
      description: 'Return email, profile, images, gyms and workout times. User ID and role fields are omitted.
        Allowed roles: athlete, trainer.'
      operationId: getMyProfile
      x-roles:
        - athlete
        - trainer
      responses:
        '200':
          description: Own profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Users
      summary: Update my profile
      description: 'Replace editable fields and associations using the existing role. Email, password, role and
        images are not editable here; unknown fields are ignored. Omitted arrays clear associations. Returns message
        only. Allowed roles: athlete, trainer.'
      operationId: updateMyProfile
      x-roles:
        - athlete
        - trainer
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: profile updated successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid profile JSON or validation failure.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid profile data
                error2:
                  value: |
                    invalid preferred gender
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/ProfileUpdateRequest'
      x-max-request-bytes: 1048576
    delete:
      tags:
        - Users
      summary: Delete my account
      description: 'Delete the current athlete/trainer account, cascading related DB records (including sessions,
        refresh tokens, swipes and chats), then delete image files. Current middleware does not check access JWTs
        against database sessions. Allowed roles: athlete, trainer.'
      operationId: deleteMyProfile
      x-roles:
        - athlete
        - trainer
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 2
                message: profile deleted successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get full user details
      description: 'Flattened profile fields plus id and role_name. Any existing role, including administrator,
        can be read. Allowed roles: administrator.'
      operationId: getUserById
      x-roles:
        - administrator
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          description: Invalid user ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid user id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/UserID'
    put:
      tags:
        - Users
      summary: Update an athlete or trainer
      description: 'Replace profile fields/associations. Email, role and images cannot change. A nonempty password
        sets a new password; omission/empty preserves it. Administrator targets return 400 invalid role. Allowed
        roles: administrator.'
      operationId: updateUser
      x-roles:
        - administrator
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 2
                message: user updated successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid ID/profile/password or target role.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid user id
                error2:
                  value: |
                    invalid profile data
                error3:
                  value: |
                    invalid role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        $ref: '#/components/requestBodies/AdminProfileUpdateRequest'
      x-max-request-bytes: 1048576
    delete:
      tags:
        - Users
      summary: Delete an athlete or trainer
      description: 'Delete the account and related records, then image files. Administrator targets are treated
        as not found. Allowed roles: administrator.'
      operationId: deleteUser
      x-roles:
        - administrator
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 2
                message: user deleted successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid user ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid user id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/UserID'
  /users/me/images:
    post:
      tags:
        - User images
      summary: Add one profile image
      description: 'Add one image to the current profile. Returns image ID and message, without URL; get URLs through
        the profile GET operation. Allowed roles: athlete, trainer.'
      operationId: addMyImage
      x-roles:
        - athlete
        - trainer
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 1
                message: image added successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid ID/multipart/file count/image, or profile already has 10 images.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/SingleImage'
      x-max-request-bytes: 11534336
  /users/{id}/images:
    post:
      tags:
        - User images
      summary: Add one profile image
      description: 'Add one image to the selected athlete/trainer profile. Returns image ID and message, without
        URL; get URLs through the profile GET operation. Allowed roles: administrator.'
      operationId: addUserImage
      x-roles:
        - administrator
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 1
                message: image added successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid ID/multipart/file count/image, or profile already has 10 images.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        $ref: '#/components/requestBodies/SingleImage'
      x-max-request-bytes: 11534336
  /users/me/images/{imageId}:
    delete:
      tags:
        - User images
      summary: Delete one profile image
      description: 'Delete an image scoped to the current profile. Cannot delete its last image. A missing target/foreign
        image returns 404 image not found. The returned ID is the image ID. Allowed roles: athlete, trainer.'
      operationId: deleteMyImage
      x-roles:
        - athlete
        - trainer
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 1
                message: image deleted successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid user/image ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid image id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '409':
          description: At least one profile image must remain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    profile must have at least one image
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/ImageID'
  /users/{id}/images/{imageId}:
    delete:
      tags:
        - User images
      summary: Delete one profile image
      description: 'Delete an image scoped to the selected athlete/trainer profile. Cannot delete its last image.
        A missing target/foreign image returns 404 image not found. The returned ID is the image ID. Allowed roles:
        administrator.'
      operationId: deleteUserImage
      x-roles:
        - administrator
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 1
                message: image deleted successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid user/image ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid image id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImageNotFound'
        '409':
          description: At least one profile image must remain.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    profile must have at least one image
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/ImageID'
  /athletes:
    get:
      tags:
        - Athletes
      summary: Get a filtered athlete swipe feed
      description: 'Up to 20 full public profiles in a stable randomized order for the seed. Filters come only from
        the caller''s saved athlete_profile (min_age/max_age/preferred_gender/min_experience/max_experience). Excludes
        the caller and all athletes already swiped by them, regardless of action. Query filters/limit are not supported.
        First call without parameters; continue with seed and next_after_id. Stop at has_more=false. Restart without
        seed/after_id when preferences change. Allowed roles: athlete.'
      operationId: listAthletes
      x-roles:
        - athlete
      responses:
        '200':
          description: Athlete page; seed is present even for an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteListResponse'
              examples:
                empty:
                  value:
                    athletes: []
                    seed: 0123456789abcdef0123456789abcdef
                    next_after_id: 0
                    has_more: false
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '400':
          description: Invalid seed/after_id, or nonzero after_id without seed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid athlete seed
                error2:
                  value: |
                    invalid athlete after ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/AthleteSeed'
        - $ref: '#/components/parameters/AthleteAfterID'
  /gyms:
    get:
      tags:
        - Gyms
      summary: List gyms
      description: All gyms ordered by ID; no pagination.
      operationId: listGyms
      x-roles: []
      responses:
        '200':
          description: Gym list; empty result is [].
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gym'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
    post:
      tags:
        - Gyms
      summary: Create a gym
      description: 'Create a unique name/address/city combination. Allowed roles: administrator.'
      operationId: createGym
      x-roles:
        - administrator
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 9
                message: gym created successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid gym JSON or field validation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid gym data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate name/address/city.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    gym already exists
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/GymRequest'
      x-max-request-bytes: 1048576
  /gyms/{id}:
    get:
      tags:
        - Gyms
      summary: Get a gym
      description: Information about the selected gym.
      operationId: getGymById
      x-roles: []
      responses:
        '200':
          description: Gym information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gym'
        '400':
          description: Invalid gym ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TextError'
              examples:
                error1:
                  value: |
                    invalid gym id
        '404':
          $ref: '#/components/responses/GymNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      parameters:
        - $ref: '#/components/parameters/GymID'
    put:
      tags:
        - Gyms
      summary: Update a gym
      description: 'Replace name, address and city; returns ID/message, not a full gym object. Allowed roles: administrator.'
      operationId: updateGym
      x-roles:
        - administrator
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDMessageResponse'
              example:
                id: 1
                message: updated gym data
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              schema:
                type: string
                enum:
                  - no-cache
        '400':
          description: Invalid gym ID/JSON or field validation.
